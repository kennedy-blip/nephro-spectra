[package]
name = "nephro-nephro-dsp"
version = "28.0.0"
edition = "2021"
rust-version = "1.76"
description = "NEPHRO-SPECTRA acoustic sonouroflowmetry DSP core and Tiselius-Hovorka RK4 stone-supersaturation integrator (compiled to WebAssembly, no_std-friendly)."
license = "MIT"
authors = ["NEPHRO-SPECTRA Clinical Systems"]
repository = "https://github.com/kennedy-blip/nephro-spectra"

[lib]
crate-type = ["cdylib", "rlib"]
name = "nephro_nephro_dsp"

[dependencies]
wasm-bindgen = "0.2.92"

[dependencies.js-sys]
version = "0.3"
optional = true

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
console = ["js-sys"]
